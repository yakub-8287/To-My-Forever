<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Zeel ❤️</title>
    <meta name="description" content="A small piece of my heart, just for you.">

    <meta property="og:type" content="website">
    <meta property="og:title" content="For My Favorite Person ❤️">
    <meta property="og:description" content="Click to open your surprise, Zeel.">
    <meta property="og:image" content="https://i0.wp.com/picjumbo.com/wp-content/uploads/happy-valentines-day-illustration-free-image.jpeg?w=600&quality=80">
    <link rel="icon" href="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/2764.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #fff5f8 0%, #fff0ea 50%, #f9f3eb 100%);
            color: #4a4a4a;
            overflow: hidden;
            min-height: 100vh;
        }

        /* Particle Background Fix */
        .particles { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            pointer-events: none; 
            z-index: 0; /* Isse content ke piche rakhein */
            overflow: hidden;
        }

        .particle { 
            position: absolute; 
            bottom: -50px; /* Start from bottom */
            font-size: 20px; /* Thoda bada size */
            color: rgba(255, 182, 193, 0.7); 
            animation: float 10s infinite linear; 
            user-select: none;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }
        .container { max-width: 600px; margin: 0 auto; height: 100vh; position: relative; z-index: 2; }

        .section {
            height: 100vh;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
        }

        .section.visible { display: flex; animation: fadeIn 1s ease; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Elegant Typography */
        h1 { font-family: 'Cormorant Garamond', serif; font-size: 2.4rem; color: #8b5e83; font-weight: 400; line-height: 1.3; }
        .letter-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(139, 94, 131, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.8);
            width: 100%;
        }

        .typewriter-text {
             font-family: 'Cormorant Garamond', serif;
            font-size: 1.15rem;
            line-height: 1.8;
            color: #5a5a5a;
            min-height: 1.5em;
            margin-bottom: 15px;
            text-align: left;
            transform: translateY(20px);
        }

        .signature {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            color: #a07090;
            margin-top: 20px;
            opacity: 0;
            transition: 2s ease;
        }

        /* Heartbeat Navigation */
        .heart-nav {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) scale(0); /* Start hidden and small */
            font-size: 4rem;
            cursor: pointer;
            z-index: 1001;
            opacity: 0; /* Smooth fade ke liye */
            transition: opacity 1.5s ease, transform 1.5s ease; /* Smooth entry */
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            
            /* Light Purple Color */
            color: #d8b4fe; 
            filter: drop-shadow(0 0 15px rgba(216, 180, 254, 0.6));
        }

        .heart-nav.show {
            opacity: 1;
            transform: translateX(-50%) scale(1); /* Smoothly pops up */
            display: block; /* Backup */
        }

        /* Beat animation tabhi start hogi jab 'active' class aayegi */
        .heart-nav.active {
            animation: heartbeat 1.4s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0% { transform: translateX(-50%) scale(1); }
            15% { transform: translateX(-50%) scale(1.1); }
            30% { transform: translateX(-50%) scale(1); }
            45% { transform: translateX(-50%) scale(1.2); }
            70% { transform: translateX(-50%) scale(1); }
        }

        /* Glossy Effect on Heart */
        .heart-nav::after {
            content: '❤️'; position: absolute; top: 0; left: 0;
            animation: gloss 3s infinite; opacity: 0;
        }
        @keyframes gloss {
            50% { opacity: 0.6; filter: brightness(2) blur(2px); }
        }

        .music-control {
            position: fixed; top: 20px; right: 20px; width: 45px; height: 45px;
            background: white; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; cursor: pointer; z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .cursor { display: inline-block; width: 2px; height: 1.2em; background: #a07090; margin-left: 2px; animation: blink 0.8s infinite; vertical-align: middle; }
        @keyframes blink { 50% { opacity: 0; } }

    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="heart-nav" id="heartBtn">💜</div>

    <div class="music-control" id="musicControl">
        <svg id="muteIcon" style="display: none;" viewBox="0 0 24 24" width="24" fill="#8b5e83"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3z"/></svg>
        <svg id="playIcon" viewBox="0 0 24 24" width="24" fill="#8b5e83"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
    </div>

    <div class="container">
        <section class="section visible" id="sec0">
            <h1>Hey Zeel… <br>I made this just for you 💖</h1>
            <p style="margin-top: 20px; font-size: 0.85rem; color: #a07090; font-weight: 300;">(Preparing your surprise...)</p>
        </section>

        <section class="section" id="sec1">
            <div class="letter-card" id="card1">
                <div class="typewriter-text" data-text="My dearest Zeel,"></div>
                <div class="typewriter-text" data-text="Eight years. Eight beautiful years we've walked together through life's seasons."></div>
                <div class="typewriter-text" data-text="We've grown from who we were into who we are, side by side, never alone."></div>
                <div class="typewriter-text" data-text="In you, I've found not just love, but a home—a place of trust, warmth, and endless companionship."></div>
                <div class="typewriter-text" data-text="You are my calm in the chaos, my laughter in the quiet, my constant in this ever-changing world."></div>
                <div class="typewriter-text" data-text="Every day with you is a gift I never take for granted."></div>
            </div>
        </section>

        <section class="section" id="sec2">
            <div class="typewriter-text" style="text-align: center; font-size: 2rem; line-height: 1.4; color: #8b5e83;" 
                 data-text="Zeel, will you be my Valentine— today, tomorrow, and for all my tomorrows? 💍"></div>
            <div class="signature" id="sig1">— Yours, Jay</div>
        </section>

        <section class="section" id="sec3">
            <div class="letter-card">
                <h2 style="font-family: 'Cormorant Garamond'; margin-bottom: 20px; color: #8b5e83;">My Promises to You</h2>
                <div class="typewriter-text" data-text="✧ To grow with you, supporting your dreams as if they were my own"></div>
                <div class="typewriter-text" data-text="✧ To love you with the same tenderness today as I will fifty years from now"></div>
                <div class="typewriter-text" data-text="✧ To be your partner, your best friend, your safe place—always"></div>
            </div>
        </section>

        <section class="section" id="sec4">
            <h1 style="font-size: 1.8rem;">This page is small, but my love for you is endless ♾️</h1>
            <div class="signature" style="opacity: 1; margin-top: 20px;">Jay ❤️ Zeel</div>
            <p style="margin-top: 40px; font-size: 0.8rem; color: #a07090;">14 February 2026</p>
        </section>
    </div>

    <audio id="bgMusic" loop>
        <source src="https://www.chosic.com/wp-content/uploads/2024/04/Rainy-Streets(chosic.com).mp3" type="audio/mpeg">
    </audio>

    <script>
        const sections = document.querySelectorAll('.section');
        const heartBtn = document.getElementById('heartBtn');
        const music = document.getElementById('bgMusic');
        let currentSection = 0;
        let typingActive = false;

        // Particle System Improved
        const particlesContainer = document.getElementById('particles');
        const icons = ['Zeel', '❤','Jay', '🌸', '✨', '☁️', '💖','Zeel'];

        for (let i = 0; i < 40; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            
            // Random horizontal position
            p.style.left = Math.random() * 100 + 'vw';
            
            // Random animation duration and delay for natural look
            const duration = 8 + Math.random() * 7;
            const delay = Math.random() * 10;
            
            p.style.animationDuration = duration + 's';
            p.style.animationDelay = delay + 's';
            p.style.fontSize = (10 + Math.random() * 20) + 'px'; // Random size
            
            particlesContainer.appendChild(p);
        }

        // Typewriter Engine
        async function typeSentence(element) {
            const text = element.getAttribute('data-text');
            element.innerHTML = '';
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            element.appendChild(cursor);

            for (let char of text) {
                const charSpan = document.createElement('span');
                charSpan.textContent = char;
                element.insertBefore(charSpan, cursor);
                await new Promise(r => setTimeout(r, 45)); // Typing speed
            }
            cursor.remove();
        }

        async function startSectionAnimation(index) {
            // Reset Heart for every new section
            heartBtn.classList.remove('show', 'active');
            heartBtn.style.pointerEvents = 'none'; // Jab tak dikhe nahi, click na ho

            const lines = sections[index].querySelectorAll('.typewriter-text');
            for (let line of lines) {
                await typeSentence(line);
                await new Promise(r => setTimeout(r, 300));
            }
            
            const sig = sections[index].querySelector('.signature');
            if (sig) sig.style.opacity = '1';

            // 3 Seconds delay after text finishes
            if (index > 0 && index < sections.length - 1) {
                setTimeout(() => {
                    heartBtn.classList.add('show'); // Fade in entry
                    heartBtn.style.pointerEvents = 'auto';
                    
                    // Fade in ke thodi der baad heartbeat start karo
                    setTimeout(() => {
                        heartBtn.classList.add('active');
                    }, 1500); 
                }, 3000);
            }
        }

        function showSection(index) {
            if (index < 0 || index >= sections.length) return;
            
            sections.forEach(s => s.classList.remove('visible'));
            sections[index].classList.add('visible');
            currentSection = index;

            // Animation start logic (Isme ab heart visibility khud manage hogi)
            startSectionAnimation(index);
        }

        // 1. Auto Swipe First Screen
        setTimeout(() => showSection(1), 4000);

        // 2. Next: Heart Tap
        heartBtn.addEventListener('click', () => showSection(currentSection + 1));

        // 3. Back: Scroll Up
        let lastScroll = 0;
        window.addEventListener('wheel', (e) => {
            if (Date.now() - lastScroll < 1500) return;
            if (e.deltaY < -20 && currentSection > 1) {
                lastScroll = Date.now();
                showSection(currentSection - 1);
            }
        });

        // Swipe Up detection for Mobile
        let touchY = 0;
        window.addEventListener('touchstart', e => touchY = e.touches[0].clientY);
        window.addEventListener('touchend', e => {
            if (e.changedTouches[0].clientY > touchY + 80 && currentSection > 1) {
                showSection(currentSection - 1);
            }
        });

        // Music Controls
        document.body.addEventListener('click', () => { if (music.paused) music.play(); }, { once: true });
        document.getElementById('musicControl').addEventListener('click', (e) => {
            e.stopPropagation();
            if (music.paused) { music.play(); playIcon.style.display='block'; muteIcon.style.display='none'; }
            else { music.pause(); playIcon.style.display='none'; muteIcon.style.display='block'; }
        });
    </script>
</body>
</html>
